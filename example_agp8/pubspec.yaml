name: flutter_timezone_example_agp8
description: "Demonstrates how to use the flutter_timezone plugin from an app using Android Gradle Plugin 8.x."
version: 0.0.1

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_timezone:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  wolverinebeach_lints:
    git:
      url: git@github.com:tjarvstrand/wolverinebeach_dart_util.git
      ref: main
      path: packages/wolverinebeach_lints

flutter:
  uses-material-design: true
